autoRollback:
  enabled: false
build:
  context: ./
  dockerfile: ./Dockerfile
  method: docker
efsStorage:
  enabled: false
name: pretty-simple-app
services:
  - autoscaling:
      cpuThresholdPercent: 15
      enabled: false
      maxInstances: 2
      memoryThresholdPercent: 15
      minInstances: 2
    cpuCores: 0.1
    instances: 1
    name: web
    port: 3000
    ramMegabytes: 200
    run: ''
    sleep: false
    terminationGracePeriodSeconds: 30
    type: web
    pathRouting:
    - path: /ip/
      port: 80
      appName: nginx
      serviceName: proxy
    - path: /headers/
      port: 80
      appName: nginx
      serviceName: proxy
    - path: /get/
      port: 80
      appName: nginx
      serviceName: proxy
    - path: /
      port: 3000
      serviceName: web
  - cpuCores: 0.1
    instances: 1
    name: worker
    ramMegabytes: 128
    run: bash worker/worker.sh
    sleep: false
    terminationGracePeriodSeconds: 30
    type: worker
  - cpuCores: 0.1
    cron: '*/1 * * * *'
    name: job
    ramMegabytes: 128
    run: bash job/job.sh
    sleep: false
    terminationGracePeriodSeconds: 30
    timeoutSeconds: 3600
    type: job
version: v2
