version: v2
name: pretty-simple-app

services:
  - name: web
    type: web
    port: 3000
    cpuCores: 0.5
    ramMegabytes: 1024
    autoscaling:
      enabled: false
    private: false
    domains: []
    healthCheck:
      enabled: false
  - name: worker
    type: worker
    run: bash worker/worker.sh
    cpuCores: 0.3
    ramMegabytes: 100
    instances: 1
  - name: job
    type: job
    run: bash job/job.sh
    allowConcurrent: false
    cpuCores: 0.1
    ramMegabytes: 100
    cron: '*/10 * * * *'

build:
	method: docker
	context: ./
	dockerfile: ./Dockerfile
