build:
  context: ./
  dockerfile: ./Dockerfile
  method: docker

name: pretty-simple-app

services:
  - autoscaling:
      enabled: false
    cpuCores: 0.5
    domains: []
    healthCheck:
      enabled: false
    instances: 2
    name: web
    port: 3000
    private: false
    ramMegabytes: 1024
    type: web
  - cpuCores: 0.3
    instances: 2
    name: worker
    ramMegabytes: 100
    run: bash worker/worker.sh
    type: worker
  - allowConcurrent: false
    cpuCores: 0.1
    cron: '*/1 * * * *'
    name: job
    ramMegabytes: 100
    run: bash job/job.sh
    type: job

version: v2
