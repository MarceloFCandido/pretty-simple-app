jobs:
  porter-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: vars
        name: Set Github tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0
      - env:
          DOCKER_BUILDKIT: "1"
          PORTER_APP_NAME: pretty-simple-app
          PORTER_BUILDKIT_ARGS: --platform linux/arm64
          PORTER_BUILDKIT_PUSH_ARGS: --platform linux/arm64
          PORTER_CLUSTER: "5365"
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: "13871"
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_APP_13871_5365 }}
        name: Build and deploy preview environment
        run: exec porter apply -f ./porter.yaml --preview  --exact
        timeout-minutes: 30

name: Deploy to Preview Environment

"on":
  pull_request:
    paths:
      - "**"
      - "!.github/workflows/porter_**"
